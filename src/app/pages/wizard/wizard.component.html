<div class="page-container">
  <header class="page-header text-center">
    <h1 class="heading-2">Setup Wizard</h1>
    <p class="text-body">Complete these steps to configure your environment.</p>
  </header>

  <div class="glass-panel wizard-container mx-auto">
    <app-stepper (completed)="complete()" finishLabel="Complete setup" nextLabel="Continue">
      <ng-template appStep="Account" stepDescription="Who you are" [stepValid]="accountValid()">
        <h3 class="heading-3 mb-4">Account information</h3>
        <app-ui-input label="Full name" placeholder="Jane Doe" [required]="true" [field]="setupForm.fullName" />
        <app-ui-input
          label="Email address"
          type="email"
          placeholder="jane@example.com"
          [required]="true"
          [field]="setupForm.email" />
      </ng-template>

      <ng-template appStep="Preferences" stepDescription="How it looks">
        <h3 class="heading-3 mb-4">Set your preferences</h3>
        <app-ui-select label="Theme mode" [options]="themeOptions" [field]="setupForm.theme" />
        <app-ui-select label="Notifications" [options]="notificationOptions" [field]="setupForm.notifications" />
      </ng-template>

      <ng-template appStep="Confirm" stepDescription="Review">
        <h3 class="heading-3 mb-4">Almost done</h3>
        <p class="text-body mb-4">Review your settings and finish. You can change any of this later in Settings.</p>
        <div class="glass-panel p-3">
          @for (row of summary(); track row.label) {
            <p class="text-small"><strong>{{ row.label }}:</strong> {{ row.value }}</p>
          }
        </div>
      </ng-template>
    </app-stepper>
  </div>
</div>
