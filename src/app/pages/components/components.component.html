<div class="page-container">
  <header class="page-header">
    <h1 class="heading-2">Component Library</h1>
    <p class="text-body">
      Interactive showcase of every UI component, each one standalone, OnPush and signal-based.
    </p>
  </header>

  <div class="components-layout">
    <nav class="components-sidenav glass-panel">
      @for (group of navGroups; track group.title) {
        <p class="sidenav-group">{{ group.title }}</p>
        @for (item of group.items; track item.path) {
          <a [routerLink]="item.path" routerLinkActive="active" class="sidenav-item">
            {{ item.label }}
          </a>
        }
      }
    </nav>

    <div class="components-content">
      <router-outlet />
    </div>
  </div>
</div>
