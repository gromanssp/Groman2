<div class="section-container">
  <h2 class="heading-3 mb-4">Tables</h2>
  <p class="text-body mb-4">
    Data tables with client-side search, sorting, pagination, per-column templates and built-in
    loading and empty states.
  </p>

  <div class="components-grid">
    <!-- Search + sort + pagination -->
    <div class="glass-panel showcase-card">
      <h3 class="card-title">Searchable, sortable, paginated</h3>
      <div class="demo-area" style="flex-direction: column; align-items: stretch;">
        <app-data-table
          [columns]="columns"
          [rows]="rows"
          [searchable]="true"
          [pageSize]="5" />
      </div>
      <app-code-snippet [code]="codes.sortable" />
    </div>

    <!-- Custom cell template -->
    <div class="glass-panel showcase-card">
      <h3 class="card-title">Custom cell templates</h3>
      <div class="demo-area" style="flex-direction: column; align-items: stretch;">
        <app-data-table [columns]="columns" [rows]="rows.slice(0, 4)">
          <ng-template appCellTemplate="status" let-value>
            <app-badge [variant]="statusVariant(value)" size="sm">{{ value }}</app-badge>
          </ng-template>
        </app-data-table>
      </div>
      <app-code-snippet [code]="codes.template" />
    </div>

    <!-- Loading and empty -->
    <div class="glass-panel showcase-card">
      <h3 class="card-title">Loading & empty states</h3>
      <div class="demo-area" style="flex-direction: column; align-items: stretch; gap: 1.5rem;">
        <app-data-table [columns]="columns" [rows]="emptyRows" [loading]="true" [pageSize]="3" />
        <app-data-table [columns]="columns" [rows]="emptyRows" emptyMessage="No users yet" />
      </div>
      <app-code-snippet [code]="codes.states" />
    </div>

    <!-- Interactive configuration -->
    <div class="glass-panel showcase-card">
      <h3 class="card-title">Interactive configuration</h3>
      <div class="demo-area" style="flex-direction: column; align-items: stretch;">
        <div class="table-toggles">
          <app-ui-switch label="Striped" [(checked)]="striped" />
          <app-ui-switch label="Hover" [(checked)]="hover" />
          <app-ui-switch label="Bordered" [(checked)]="bordered" />
        </div>
        <app-data-table
          [columns]="columns"
          [rows]="rows.slice(0, 4)"
          [striped]="striped()"
          [hover]="hover()"
          [bordered]="bordered()" />
      </div>
      <app-code-snippet [code]="codes.default" />
    </div>
  </div>
</div>
