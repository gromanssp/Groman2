<div class="section-container">
  <h2 class="heading-3 mb-4">Spinners</h2>
  <p class="text-body mb-4">Loading indicators with multiple variants, sizes, and customizable colors.</p>

  <div class="components-grid">
    <!-- Circular Spinner -->
    <div class="glass-panel showcase-card">
      <h3 class="card-title">Circular Spinner</h3>
      <div class="demo-area">
        <app-spinner variant="circular" size="sm" />
        <app-spinner variant="circular" size="md" />
        <app-spinner variant="circular" size="lg" />
      </div>
      <app-code-snippet [code]="codes.circular" />
    </div>

    <!-- Dots Spinner -->
    <div class="glass-panel showcase-card">
      <h3 class="card-title">Dots Spinner</h3>
      <div class="demo-area">
        <app-spinner variant="dots" size="sm" />
        <app-spinner variant="dots" size="md" />
        <app-spinner variant="dots" size="lg" />
      </div>
      <app-code-snippet [code]="codes.dots" />
    </div>

    <!-- Pulse Spinner -->
    <div class="glass-panel showcase-card">
      <h3 class="card-title">Pulse Spinner</h3>
      <div class="demo-area">
        <app-spinner variant="pulse" size="sm" />
        <app-spinner variant="pulse" size="md" />
        <app-spinner variant="pulse" size="lg" />
      </div>
      <app-code-snippet [code]="codes.pulse" />
    </div>

    <!-- Color Customization -->
    <div class="glass-panel showcase-card">
      <h3 class="card-title">Color Customization</h3>
      <div class="demo-area">
        <app-spinner variant="circular" [color]="'var(--success)'" />
        <app-spinner variant="circular" [color]="'var(--danger)'" />
        <app-spinner variant="circular" [color]="'var(--warning)'" />
        <app-spinner variant="dots" [color]="'var(--info)'" />
        <app-spinner variant="pulse" [color]="'var(--success)'" />
      </div>
      <app-code-snippet [code]="codes.colors" />
    </div>
  </div>
</div>
